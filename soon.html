<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      background: #fff;
      color: #080808;
      display: grid;
      place-items: center;
      font-family: "DM Sans", sans-serif;
      overflow: hidden;
    }
    main {
      width: min(100% - 40px, 1100px);
      min-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      padding: 50px 0;
    }
    .eyebrow {
      text-transform: uppercase;
      letter-spacing: .42em;
      font-size: 10px;
      font-weight: 700;
      margin-bottom: 34px;
    }
    h1 {
      margin: 0;
      font-size: clamp(48px, 10vw, 124px);
      line-height: .95;
      letter-spacing: -.075em;
      font-weight: 700;
      text-transform: uppercase;
    }
    h1 span {
      display: block;
      font-family: "Playfair Display", Georgia, serif;
      font-style: italic;
      font-weight: 500;
      text-transform: none;
      letter-spacing: -.06em;
      margin-top: .12em;
    }
    .rule {
      width: 46px;
      height: 1px;
      background: #111;
      margin: 38px 0 22px;
    }
    .subtitle {
      font-size: 11px;
      letter-spacing: .22em;
      line-height: 1.8;
      text-transform: uppercase;
      margin: 0;
    }
    .corner {
      position: absolute;
      top: 28px;
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .corner.left { left: 0; }
    .corner.right { right: 0; }
    footer {
      position: absolute;
      bottom: 24px;
      font-size: 9px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    @media (max-width: 520px) {
      .corner { top: 14px; font-size: 8px; letter-spacing: .12em; }
      .eyebrow { letter-spacing: .28em; }
      .subtitle { letter-spacing: .13em; }
    }
  </style>
</head>
<body>
  <main>
    <div class="corner left"></div>
    <div class="corner right"></div>
    <div class="eyebrow"></div>
    <h1>Coming <span>Soon.</span></h1>
    <div class="rule"></div>
    <p class="subtitle"></p>
    <footer>© <span id="year"></span> — All rights reserved</footer>
  </main>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
